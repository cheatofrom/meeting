# GitHub Repository Settings
# 这个文件可以配合GitHub Actions自动设置仓库信息

repository:
  # 项目描述
  description: "🎙️ 基于FunASR的实时语音识别系统 - 支持会议记录、文件转录、AI智能总结"
  
  # 项目主页
  homepage: "https://your-username.github.io/Meeting-ASR-System"
  
  # 项目话题/标签
  topics:
    - speech-recognition
    - funasr
    - websocket
    - react
    - typescript
    - ai
    - meeting
    - transcription
    - python
    - real-time
    - voice-to-text
    - chinese
  
  # 项目设置
  private: false
  has_issues: true
  has_projects: true
  has_wiki: true
  has_pages: false
  has_downloads: true
  default_branch: main
  
  # 允许的合并类型
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  
  # 自动删除头分支
  delete_branch_on_merge: true
  
  # 启用漏洞警报
  enable_vulnerability_alerts: true
  enable_automated_security_fixes: true